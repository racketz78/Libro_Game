<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Garibaldi: La Spedizione dei Mille</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      background-color: #121418;
      background-image: radial-gradient(circle at 50% 20%, #1e2430 0%, #121418 70%, #0a0c10 100%);
      color: #f1f3f7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 1.05rem;
      line-height: 1.6;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px 16px 40px;
    }

    .app-container {
      width: 100%;
      max-width: 520px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* App Header / Brand */
    .app-header {
      text-align: center;
      margin-bottom: 4px;
    }

    .app-title-main {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #f0b969;
      text-transform: uppercase;
      margin-bottom: 2px;
    }

    .app-subtitle {
      font-size: 0.82rem;
      color: #94a3b8;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    /* Card Cardinale */
    .game-card {
      width: 100%;
      background-color: #1b1f28;
      border: 1px solid #2d3548;
      border-radius: 20px;
      padding: 28px 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 1px rgba(255, 255, 255, 0.1) inset;
      transition: background-color 0.3s ease, border-color 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    /* Dynamic Themes for Insight / Paradox */
    .game-card.theme-insight {
      background-color: #14281e;
      border-color: #27563d;
    }

    .game-card.theme-paradox {
      background-color: #2c1515;
      border-color: #592525;
    }

    /* Home Hero Image */
    .hero-image-box {
      width: 100%;
      height: 200px;
      border-radius: 14px;
      overflow: hidden;
      margin-bottom: 20px;
      border: 1px solid #364156;
      background: #0f1218;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .hero-image-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
    }

    /* Breadcrumb Thread */
    .thread-container {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 18px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      overflow-x: auto;
      scrollbar-width: none;
    }
    .thread-container::-webkit-scrollbar {
      display: none;
    }

    .thread-dot {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background-color: #2a3245;
      border: 2px solid #3c4860;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.68rem;
      font-weight: 700;
      color: #94a3b8;
      flex-shrink: 0;
      transition: all 0.2s ease;
    }

    .thread-dot.status-green {
      background-color: #1b4d31;
      border-color: #2ecc71;
      color: #2ecc71;
    }

    .thread-dot.status-yellow {
      background-color: #5c4b16;
      border-color: #f1c40f;
      color: #f1c40f;
    }

    .thread-dot.status-red {
      background-color: #5c1d1d;
      border-color: #e74c3c;
      color: #e74c3c;
    }

    .thread-dot.current {
      box-shadow: 0 0 0 3px rgba(240, 185, 105, 0.3);
      border-color: #f0b969;
      color: #f0b969;
    }

    /* Badges */
    .badge {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 5px 12px;
      border-radius: 8px;
      margin-bottom: 14px;
      border: 1px solid transparent;
    }

    .badge-story { color: #cbd5e1; background-color: #262e3d; border-color: #3b465e; }
    .badge-decision { color: #f0b969; background-color: #3a2e1c; border-color: #70562e; }
    .badge-paradox { color: #f87171; background-color: #451a1a; border-color: #7f2727; }
    .badge-insight { color: #4ade80; background-color: #143825; border-color: #226e45; }
    .badge-epilogue { color: #f0b969; background-color: #3a2e1c; border-color: #70562e; }

    .node-title {
      font-size: 1.35rem;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.3;
      margin-bottom: 14px;
    }

    .node-text {
      color: #d1d5db;
      font-size: 1.04rem;
      margin-bottom: 24px;
      word-wrap: break-word;
    }

    /* Debrief Box */
    .debrief-box {
      background-color: #1b0e0e;
      border: 1px solid #592525;
      border-left: 4px solid #ef4444;
      border-radius: 14px;
      padding: 16px 18px;
      margin-bottom: 24px;
    }

    .debrief-title {
      font-size: 0.88rem;
      font-weight: 700;
      color: #f87171;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .debrief-text {
      font-size: 0.95rem;
      color: #fca5a5;
      line-height: 1.5;
    }

    /* Highlights */
    .hl-gold {
      color: #f0b969;
      border-bottom: 1px dashed #f0b969;
    }

    .hl-persona {
      color: #38bdf8;
      border-bottom: 1px dashed #38bdf8;
      cursor: pointer;
      font-weight: 600;
    }
    .hl-persona:hover {
      color: #7dd3fc;
    }

    /* Icon Navigation Button (Bottom) */
    .btn-icon-next {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 52px;
      height: 52px;
      margin-left: auto;
      background-color: #f0b969;
      color: #121418;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(240, 185, 105, 0.35);
      transition: transform 0.2s ease, background-color 0.2s ease;
    }

    .btn-icon-next:hover {
      background-color: #f4c682;
      transform: scale(1.05);
    }

    .btn-icon-next svg {
      width: 24px;
      height: 24px;
      stroke: currentColor;
      stroke-width: 2.5;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Choices List with Chromatic Differentiation */
    .choices-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 10px;
    }

    .btn-choice {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      width: 100%;
      padding: 16px;
      font-family: inherit;
      font-size: 0.98rem;
      line-height: 1.45;
      color: #f1f3f7;
      border-radius: 14px;
      cursor: pointer;
      text-align: left;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }

    .btn-choice:hover {
      transform: translateY(-2px);
    }

    /* Option A: Distinct Theme (Indigo/Slate accent) */
    .btn-choice.option-a {
      background-color: #202636;
      border: 1px solid #3b4663;
    }
    .btn-choice.option-a:hover {
      border-color: #60a5fa;
      background-color: #252e42;
    }
    .btn-choice.option-a .choice-key {
      background-color: #151922;
      color: #60a5fa;
      border-color: #3b4663;
    }

    /* Option B: Distinct Theme (Amber/Bronze accent) */
    .btn-choice.option-b {
      background-color: #2b241c;
      border-color: #5c472b;
    }
    .btn-choice.option-b:hover {
      border-color: #f0b969;
      background-color: #362e22;
    }
    .btn-choice.option-b .choice-key {
      background-color: #1a1611;
      color: #f0b969;
      border-color: #5c472b;
    }

    .choice-key {
      flex-shrink: 0;
      font-weight: 800;
      font-size: 0.85rem;
      border: 1px solid;
      border-radius: 8px;
      padding: 4px 10px;
      margin-top: 1px;
    }

    /* Persona Modal - Deep Blue Premium Theme */
    .overlay-backdrop {
      position: fixed;
      inset: 0;
      background-color: rgba(8, 11, 18, 0.82);
      backdrop-filter: blur(5px);
      display: none;
      justify-content: center;
      align-items: center;
      padding: 20px;
      z-index: 1000;
    }

    .overlay-backdrop.active {
      display: flex;
    }

    .persona-modal {
      width: 100%;
      max-width: 440px;
      background-color: #0f1a2e; /* Deep Blue background */
      border: 1px solid #1e3a68;
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 24px 50px rgba(0, 0, 0, 0.8), 0 0 15px rgba(56, 189, 248, 0.15);
      animation: modalPop 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes modalPop {
      0% { transform: scale(0.92); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .persona-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 18px;
      padding-bottom: 14px;
      border-bottom: 1px solid #1e3a68;
    }

    .persona-name {
      font-size: 1.3rem;
      font-weight: 800;
      color: #38bdf8;
      line-height: 1.2;
    }

    .persona-close {
      background: #172a4d;
      border: 1px solid #2b4c82;
      color: #93c5fd;
      border-radius: 10px;
      width: 36px;
      height: 36px;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.2s;
    }
    .persona-close:hover {
      background: #1e3a68;
      color: #fff;
    }

    .persona-body {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .persona-field {
      background: #0a101d;
      border: 1px solid #172a4d;
      border-radius: 12px;
      padding: 12px 14px;
    }

    .persona-label {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #7dd3fc;
      margin-bottom: 3px;
    }

    .persona-value {
      font-size: 0.94rem;
      color: #e2e8f0;
      line-height: 1.45;
    }
  </style>
</head>
<body>

  <div class="app-container">

      <div class="persona-body" id="persona-body"></div>
    </div>
  </div>

    function loadResults() {
      try {
        const saved = localStorage.getItem(STORAGE_RESULTS_KEY);

      } catch (_) {}
      return new Array(TOTAL_BIVIS).fill(null);

      try {

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function parseFormattedText(rawText) {
      if (!rawText) return "";
      const escaped = escapeHtml(rawText);
      return escaped.replace(/~(data|nozione|evento|persona)~([^~]+)~/g, (_, type, content) => {
        if (type === "persona") {
          return '<span class="hl-persona" role="button" tabindex="0" data-persona="' + content + '">' + content + '</span>';
        }
        return '<span class="hl-gold">' + content + '</span>';
      });
    }

    function openPersonaModal(name) {
      const sheet = CHARACTER_SHEETS[name] || {
        chi: "Protagonista storico delle vicende del 1860-1861.",
        vuole: "Realizzare i propri obiettivi nella campagna per l'unificazione.",
        costa: "Rischi militari e politici del conflitto risorgimentale.",
        riconosci: "Citato nelle cronache storiche della Spedizione dei Mille."
      };
      personaTitle.textContent = name;
      personaBody.innerHTML =
        '<div class="persona-field">' +
          '<div class="persona-label">Chi è</div>' +
          '<div class="persona-value">' + escapeHtml(sheet.chi) + '</div>' +
        '</div>' +
        '<div class="persona-field">' +
          '<div class="persona-label">Cosa vuole</div>' +
          '<div class="persona-value">' + escapeHtml(sheet.vuole) + '</div>' +
        '</div>' +

          '<div class="persona-value">' + escapeHtml(sheet.riconosci) + '</div>' +
        '</div>';
      overlay.classList.add("active");
    }

        return;
      }
      const navBtn = e.target.closest("[data-target]");
      if (navBtn) {
        const targetId = navBtn.getAttribute("data-target");
        if (targetId && NODE_MAP[targetId]) {
          handleNavigation(targetId);
        }
      }
    });

    function handleNavigation(targetId) {
      const targetNode = NODE_MAP[targetId];
      // If we are coming from a paradox (retry), record red if first time failing, or upgrade/keep yellow
      const currentNode = getCurrentNode();
      if (currentNode && currentNode.type === "paradox") {
        const decisionId = currentNode.foldback;
        const decNode = NODE_MAP[decisionId];
        if (decNode && typeof decNode.decisionIndex === "number") {
          const idx = decNode.decisionIndex;
          if (decisionResults[idx] === null || decisionResults[idx] === 'red') {
            decisionResults[idx] = 'yellow'; // failed 1st try, now retrying
          } else if (decisionResults[idx] !== 'yellow') {
            decisionResults[idx] = 'yellow';
          }
          saveResults();
        }
      } else if (currentNode && currentNode.type === "decision") {
        // If clicking choice A (paradox), record red initially if null
        const choice = currentNode.choices.find(c => c.target === targetId);
        if (choice && targetId.startsWith("paradox")) {
          const idx = currentNode.decisionIndex;
          if (decisionResults[idx] === null) {
            decisionResults[idx] = 'red';
            saveResults();
          }
        } else if (choice && targetId.startsWith("insight")) {
          const idx = currentNode.decisionIndex;
          if (decisionResults[idx] === null) {
            decisionResults[idx] = 'green'; // 1st try correct!
            saveResults();
          }
        }
      }
      renderNode(targetId);
    }

    let activeNodeId = "intro";
    function getCurrentNode() { return NODE_MAP[activeNodeId]; }

    function renderThread(activeDecisionIdx) {
      let html = '<div class="thread-container">';
      for (let i = 0; i < TOTAL_BIVIS; i++) {
        let statusClass = "";
        const res = decisionResults[i];
        if (res === 'green') statusClass = "status-green";
        else if (res === 'yellow') statusClass = "status-yellow";
        else if (res === 'red') statusClass = "status-red";

        let currentClass = (i === activeDecisionIdx) ? "current" : "";
        html += '<div class="thread-dot ' + statusClass + ' ' + currentClass + '">' + (i + 1) + '</div>';
      }
      html += '</div>';
      return html;
    }

    function renderNode(nodeId) {
      activeNodeId = nodeId;
      const node = NODE_MAP[nodeId] || NODE_MAP["intro"];
      try { localStorage.setItem(STORAGE_NODE_KEY, node.id); } catch (_) {}

      appCard.className = "game-card";
      let html = "";

      // Determine active decision index for thread
      let currentBiviIdx = -1;
      if (node.type === "decision") currentBiviIdx = node.decisionIndex;
      else if (node.type === "paradox") {
        const decNode = NODE_MAP[node.foldback];
        if (decNode) currentBiviIdx = decNode.decisionIndex;
      } else if (node.type === "insight") {
        // find previous decision
        // Approximate based on flow or search backward
        currentBiviIdx = getBiviIndexForNode(nodeId);
      } else {
        currentBiviIdx = getBiviIndexForNode(nodeId);
      }

      html += renderThread(currentBiviIdx);

      if (node.type === "intro") {
        appCard.classList.add("theme-story");
        html += '<div class="badge badge-story">Premessa Storica</div>';
        html += '<div class="hero-image-box">';
        // Garibaldi historical portrait placeholder / image representation
        html += '<img src="https://upload.wikimedia.org/wikipedia/commons/thumb/0/07/Giuseppe_Garibaldi_by_Gustave_Le_Gray%2C_1860s.jpg/800px-Giuseppe_Garibaldi_by_Gustave_Le_Gray%2C_1860s.jpg" alt="Giuseppe Garibaldi">';
        html += '</div>';
        if (node.title) html += '<h2 class="node-title">' + escapeHtml(node.title) + '</h2>';
        html += '<div class="node-text">' + parseFormattedText(node.text) + '</div>';
        html += '<button type="button" class="btn-icon-next" data-target="' + escapeHtml(node.next) + '" aria-label="Continua"><svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg></button>';
      } else if (node.type === "story") {
        html += '<div class="badge badge-story">Capitolo Storico</div>';
        if (node.title) html += '<h2 class="node-title">' + escapeHtml(node.title) + '</h2>';
        html += '<div class="node-text">' + parseFormattedText(node.text) + '</div>';
        html += '<button type="button" class="btn-icon-next" data-target="' + escapeHtml(node.next) + '" aria-label="Continua"><svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg></button>';
      } else if (node.type === "decision") {
        html += '<div class="badge badge-decision">Scelta Decisiva</div>';
        html += '<div class="node-text">' + parseFormattedText(node.text) + '</div>';
        html += '<div class="choices-list">';
        node.choices.forEach((choice, idx) => {
          const label = choice.id.toUpperCase();
          const themeClass = (idx === 0) ? "option-a" : "option-b";
          html +=
            '<button type="button" class="btn-choice ' + themeClass + '" data-target="' + escapeHtml(choice.target) + '">' +
              '<span class="choice-key">[' + escapeHtml(label) + ']</span>' +
              '<span>' + escapeHtml(choice.text) + '</span>' +
            '</button>';
        });
        html += '</div>';
      } else if (node.type === "paradox") {
        appCard.classList.add("theme-paradox");
        html += '<div class="badge badge-paradox">Scelta da rivedere</div>';
        html += '<div class="node-text">' + parseFormattedText(node.text) + '</div>';
        html +=
          '<div class="debrief-box">' +
            '<div class="debrief-title">Cos\'è successo davvero nella Storia?</div>' +
            '<div class="debrief-text">' + parseFormattedText(node.debrief) + '</div>' +
          '</div>';
        html += '<button type="button" class="btn-icon-next" data-target="' + escapeHtml(node.foldback) + '" aria-label="Riprova"><svg viewBox="0 0 24 24"><path d="M23 4v6h-6"></path><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg></button>';
      } else if (node.type === "insight") {
        appCard.classList.add("theme-insight");
        html += '<div class="badge badge-insight">Scelta Giusta</div>';
        html += '<div class="node-text">' + parseFormattedText(node.text) + '</div>';
        html += '<button type="button" class="btn-icon-next" data-target="' + escapeHtml(node.next) + '" aria-label="Continua"><svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg></button>';
      } else if (node.type === "epilogue") {
        html += '<div class="badge badge-epilogue">Epilogo Storico</div>';
        if (node.title) html += '<h2 class="node-title">' + escapeHtml(node.title) + '</h2>';
        html += '<div class="node-text">' + parseFormattedText(node.text) + '</div>';
      }

      appCard.innerHTML = html;
      window.scrollTo(0, 0);
    }

    function getBiviIndexForNode(nodeId) {
      // Helper to map current node to bivi index for thread display
      const mapping = {
        "intro": 0, "story_1": 0, "story_2": 0,
        "story_3": 1, "story_4": 1,
        "story_5": 2, "story_6": 2,
        "story_7": 3, "story_8": 3,
        "story_9": 4, "story_10": 4,
        "story_11": 5, "story_12": 5,
        "story_13": 6, "story_14": 6, "epilogue": 6
      };
      return mapping[nodeId] !== undefined ? mapping[nodeId] : 0;
    }

    // Init storage recovery or default
    function initApp() {
      let savedNode = "intro";
      try {
        const s = localStorage.getItem(STORAGE_NODE_KEY);
        if (s && NODE_MAP[s]) savedNode = s;
      } catch (_) {}
      renderNode(savedNode);
    }

    initApp();
  </script>
</body>
</html>
